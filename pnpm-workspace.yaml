allowBuilds:
  canvas: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@iblai/*"
# One physical copy of each @iblai/* package, hoisted to the root. pnpm otherwise
# keeps a copy per peer-dependency permutation, and the SDK's React contexts live
# on the module instance: a component from one copy cannot see providers from
# another (RTK Query hooks then silently return undefined).
dedupePeerDependents: true
publicHoistPattern:
  - "@iblai/*"
